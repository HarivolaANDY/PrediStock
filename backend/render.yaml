services:
  # ─── Django Web Service ───────────────────────────────────
  - type: web
    name: predistock-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput --clear
    startCommand: gunicorn config.wsgi:application --workers=2 --threads=4 --timeout=120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.vercel.app,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: predistock-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: predistock-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

  # ─── django-q Background Worker ───────────────────────────
  - type: worker
    name: predistock-worker
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py qcluster
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.vercel.app,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: predistock-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: predistock-redis
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

  # ─── Redis (for django-q broker & caching) ────────────────
  - type: keyvalue
    name: predistock-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all

# ─── PostgreSQL Database ────────────────────────────────────
databases:
  - name: predistock-db
    plan: free
    region: frankfurt
    databaseName: predistock
    ipAllowList: []
